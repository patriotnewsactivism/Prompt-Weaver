kind = "web"
previewPath = "/"
title = "Prompt Reasoning Engine"
version = "1.0.0"
id = "artifacts/prompt-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22503

[services.development]
run = "pnpm --filter @workspace/prompt-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prompt-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/prompt-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22503"
BASE_PATH = "/"
